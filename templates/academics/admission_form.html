{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">

        <div class="shadow-lg p-5 rounded-4 bg-white">

            <div class="text-center mb-4">
                <h2 class="fw-bold">Admission Form</h2>
                <p class="text-muted">Fill in the details to submit admission request</p>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-semibold">Student Name</label>
                        <input type="text"
                               name="student_name"
                               class="form-control form-control-lg rounded-3"
                               placeholder="Enter student name"
                               required>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-semibold">Parent Name</label>
                        <input type="text"
                               name="parent_name"
                               class="form-control form-control-lg rounded-3"
                               placeholder="Enter parent name"
                               required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Parent Email</label>
                    <input type="email"
                           name="parent_email"
                           class="form-control form-control-lg rounded-3"
                           placeholder="Enter parent email"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Class</label>
                    <select name="class_id"
                            class="form-select form-select-lg rounded-3">
                        {% for c in classes %}
                            <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit"
                            class="btn btn-primary btn-lg rounded-3">
                        Submit Application
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>

{% endblock %}

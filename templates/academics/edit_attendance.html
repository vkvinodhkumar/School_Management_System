{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6">

        <div class="shadow-lg p-5 rounded-4 bg-white">

            <div class="mb-4">
                <h3 class="fw-bold">Edit Attendance</h3>
                <p class="text-muted">Modify attendance status for the selected record</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label fw-semibold">Student</label>
                    <input type="text"
                           class="form-control form-control-lg rounded-3 bg-light"
                           value="{{ record.student.full_name }}"
                           disabled>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Date</label>
                    <input type="text"
                           class="form-control form-control-lg rounded-3 bg-light"
                           value="{{ record.date }}"
                           disabled>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Status</label>
                    <select name="status"
                            class="form-select form-select-lg rounded-3">
                        <option value="Present"
                            {% if record.status == "Present" %}selected{% endif %}>
                            Present
                        </option>
                        <option value="Absent"
                            {% if record.status == "Absent" %}selected{% endif %}>
                            Absent
                        </option>
                    </select>
                </div>

                <div class="d-grid">
                    <button class="btn btn-success btn-lg rounded-3">
                        Update
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>

{% endblock %}

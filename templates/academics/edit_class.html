{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6">

        <div class="shadow-lg p-5 rounded-4 bg-white">

            <div class="mb-4">
                <h2 class="fw-bold">Edit Class</h2>
                <p class="text-muted">Update class details below</p>
            </div>

            <form method="post">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label class="form-label fw-semibold">Class Name</label>
                    <input type="text"
                           name="name"
                           value="{{ class_obj.name }}"
                           class="form-control form-control-lg rounded-3"
                           placeholder="Enter class name"
                           required>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit"
                            class="btn btn-success px-4 rounded-3">
                        Update
                    </button>

                    <a href="{% url 'principal_class_list' %}" 
                       class="btn btn-secondary px-4 rounded-3">
                        Cancel
                    </a>
                </div>

            </form>

        </div>

    </div>
</div>

{% endblock %}

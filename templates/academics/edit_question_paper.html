{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6">

        <div class="shadow-lg p-5 rounded-4 bg-white">

            <div class="mb-4">
                <h3 class="fw-bold">Edit Question Paper</h3>
                <p class="text-muted">
                    Upload a new file to replace the existing question paper
                </p>
            </div>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        Replace File (Optional)
                    </label>
                    <input type="file"
                           name="file"
                           class="form-control form-control-lg rounded-3">
                </div>

                <div class="d-grid">
                    <button class="btn btn-success btn-lg rounded-3">
                        Update
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>

{% endblock %}

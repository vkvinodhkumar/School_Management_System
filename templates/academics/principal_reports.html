{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">

        <div class="mb-4">
            <a href="{% url 'principal_dashboard' %}"
               class="btn btn-secondary btn-lg rounded-3">
                Back
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-5">

            <div class="mb-4">
                <h3 class="fw-bold">School Reports</h3>
                <p class="text-muted">
                    Overview of institutional statistics
                </p>
            </div>

            <div class="row g-4 text-center">

                <div class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h6 class="text-muted">Total Students</h6>
                        <h2 class="fw-bold text-primary">
                            {{ total_students }}
                        </h2>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h6 class="text-muted">Total Classes</h6>
                        <h2 class="fw-bold text-success">
                            {{ total_classes }}
                        </h2>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h6 class="text-muted">Total Sections</h6>
                        <h2 class="fw-bold text-warning">
                            {{ total_sections }}
                        </h2>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h6 class="text-muted">Total Teachers</h6>
                        <h2 class="fw-bold text-danger">
                            {{ total_teachers }}
                        </h2>
                    </div>
                </div>

            </div>

        </div>

    </div>
</div>

{% endblock %}

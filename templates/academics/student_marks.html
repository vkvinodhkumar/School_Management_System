{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-10">

        <div class="mb-4">
            <h2 class="fw-bold">Marks</h2>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4">

            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">

                    <thead class="table-dark">
                        <tr>
                            <th>Subject</th>
                            <th>Exam</th>
                            <th>Marks</th>
                            <th>Out Of</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for m in marks %}
                        <tr>
                            <td class="fw-semibold">
                                {{ m.subject.name }}
                            </td>
                            <td>
                                {{ m.exam.name }}
                            </td>
                            <td>
                                <span class="badge bg-primary rounded-pill px-3 py-2">
                                    {{ m.marks }}
                                </span>
                            </td>
                            <td>
                                {{ m.exam.max_marks }}
                            </td>
                        </tr>

                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-muted py-4">
                                No marks available
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>
            </div>

        </div>

    </div>
</div>

{% endblock %}

{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6">

        <div class="card border-0 shadow-sm rounded-4 p-5">

            <div class="mb-4 text-center">
                <h4 class="fw-bold">Submit Homework</h4>
                <p class="text-muted mb-1">You are submitting for:</p>
                <h5 class="fw-semibold">
                    {{ homework.title }}
                </h5>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        Upload Your File
                    </label>
                    <input type="file"
                           name="file"
                           class="form-control form-control-lg rounded-3"
                           required>
                </div>

                <div class="d-grid">
                    <button type="submit"
                            class="btn btn-primary btn-lg rounded-3">
                        Upload
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>

{% endblock %}

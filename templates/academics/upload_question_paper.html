{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-10">

        <!-- Title -->
        <div class="mb-4">
            <h2 class="fw-bold">Upload Question Paper</h2>
        </div>

        <!-- Upload Form -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-5">

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="row g-4">

                    <!-- Select Class -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Select Class
                        </label>
                        <select name="assignment_id"
                                class="form-select form-select-lg rounded-3"
                                required>
                          <option value="">Select Class</option>

{% for a in assignments %}
<option value="{{ a.id }}">
{{ a.class_obj.name }} - {{ a.section.name }} ({{ a.subject.name }})
</option>
{% endfor %}

{% for s in sections %}
<option disabled>
{{ s.class_obj.name }} - {{ s.name }} (Class Teacher)
</option>
{% endfor %}
                        </select>
                    </div>

                    <!-- File Upload -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">
                            Upload File
                        </label>
                        <input type="file"
                               name="file"
                               class="form-control form-control-lg rounded-3"
                               required>
                    </div>

                </div>

                <div class="text-end mt-4">
                    <button type="submit"
                            class="btn btn-primary btn-lg rounded-3 px-4">
                        Upload
                    </button>
                </div>

            </form>

        </div>

        <!-- Uploaded Papers Section -->
        <div class="card border-0 shadow-sm rounded-4 p-4">

            <h4 class="fw-semibold mb-3">
                Your Uploaded Papers
            </h4>

            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">

                    <thead class="table-dark">
                        <tr>
                            <th>Class</th>
                            <th>Uploaded</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for p in papers %}
                        <tr>

                            <td class="fw-semibold">
                                {{ p.class_obj.name }}
                            </td>

                            <td>
                                {{ p.uploaded_at }}
                            </td>

                            <td>

                                <!-- View -->
                                <a href="{{ p.file.url }}"
                                   target="_blank"
                                   class="btn btn-primary btn-sm rounded-3 me-2">
                                    View
                                </a>

                                <!-- Edit -->
                                <a href="{% url 'edit_question_paper' p.id %}"
                                   class="btn btn-warning btn-sm rounded-3 me-2">
                                    Edit
                                </a>

                                <!-- Delete -->
                                <a href="{% url 'delete_question_paper' p.id %}"
                                   class="btn btn-danger btn-sm rounded-3"
                                   onclick="return confirm('Delete this paper?');">
                                    Delete
                                </a>

                            </td>

                        </tr>

                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-muted py-4">
                                No question papers uploaded.
                            </td>
                        </tr>
                        {% endfor %}

                    </tbody>

                </table>
            </div>

        </div>

    </div>
</div>

{% endblock %}

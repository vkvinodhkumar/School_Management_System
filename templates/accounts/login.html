{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="shadow-lg p-5 rounded-4 bg-white">

            <div class="text-center mb-4">
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-muted">Login to continue to EduFlow</p>
            </div>

            <form method="post" autocomplete="off">
                {% csrf_token %}

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger rounded-3">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <div class="mb-4">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" 
                           name="email" 
                           class="form-control form-control-lg rounded-3"
                           placeholder="Enter your email"
                           style="background-color:#ffffff; font-size:16px; color:#000;"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" 
                           name="password" 
                           class="form-control form-control-lg rounded-3"
                           placeholder="Enter your password"
                           style="background-color:#ffffff; font-size:18px; color:#000; letter-spacing:3px;"
                           required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-dark btn-lg rounded-3">
                        Login
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>

{% endblock %}
